name: build-image

# Construye y publica la imagen Docker del backend en GitHub Container
# Registry (ghcr.io). Se ejecuta al hacer push a master, al crear un tag
# vX.Y.Z, o manualmente desde la pestaña Actions.
#
# Se compila solo para arm64 (la unica arquitectura donde se despliega: VM
# Oracle Ampere A1). Para probar la imagen localmente en otra arquitectura,
# usar "docker compose build" (ver docker-compose.yml), no esta imagen.

on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'doc/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (cross-build ARM)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
