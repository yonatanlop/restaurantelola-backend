# Configuracion para el perfil "docker" (activado con SPRING_PROFILES_ACTIVE=docker).
# Todos los valores sensibles/variables se inyectan por variables de entorno,
# ver docker-compose.yml y .env.example en la raiz del repo.

# Server Configuration
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/contabilidadRestaurante?connectTimeout=10&socketTimeout=30&tcpKeepAlive=true}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration (mismo ajuste conservador que en local)
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=90000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.transaction.default-timeout=60
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false

# Application Name
spring.application.name=Restaurante Dona Lola

# JWT Configuration (sin valor por defecto: el contenedor no arranca si falta JWT_SECRET)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Propinas (HU-014)
propinas.enabled=${PROPINAS_ENABLED:false}

# Static Resources (el frontend se sirve desde su propio contenedor Nginx, no desde aqui)
spring.web.resources.static-locations=classpath:/static/

# Logging
logging.level.com.tialola=${LOG_LEVEL:INFO}

# Caja Registradora: el puerto serial (COM1) es hardware local de Windows y NO existe
# dentro de un contenedor Linux en la nube. Deshabilitado por defecto en este perfil.
caja.registradora.puerto=${CAJA_PUERTO:COM1}
caja.registradora.habilitada=${CAJA_HABILITADA:false}
