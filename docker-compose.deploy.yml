# Overlay para desplegar en un servidor donde 80/443 ya estan ocupados por el
# Caddy de otro proyecto (ver deploy/shared-caddy.md).
#
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d --build
#
# "frontend" deja de publicar su puerto al host: se conecta a la red externa
# compartida "edge" para que ese Caddy lo alcance por nombre de contenedor,
# con un container_name unico ("restaurantelola-web") para evitar colisiones
# de resolucion DNS con el servicio "web"/"frontend" de otros proyectos en
# esa misma red compartida (ver incidente documentado en deploy/shared-caddy.md).
# "backend" tampoco publica su puerto: el propio nginx de "frontend" ya hace
# de proxy hacia el backend para /api (igual que en local), asi que todo el
# trafico externo entra por Caddy -> frontend -> backend, sin exponer el
# backend en HTTP plano directamente a internet.
#
# Requiere que exista la red externa: docker network create edge

services:
  backend:
    ports: !reset []

  frontend:
    container_name: restaurantelola-web
    ports: !reset []
    networks:
      - default
      - edge

networks:
  edge:
    external: true
