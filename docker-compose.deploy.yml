# Compose para DESPLIEGUE (Oracle Cloud u otro servidor).
# Usa las imagenes ya construidas por GitHub Actions en ghcr.io (ver
# .github/workflows/build-image.yml de este repo y del de tialola-frontend)
# — no compila nada en el servidor.
#
#   docker compose -f docker-compose.deploy.yml pull
#   docker compose -f docker-compose.deploy.yml up -d
#
# El frontend NO publica ningun puerto al host: en este servidor ya hay un
# Caddy de otro proyecto ocupando 80/443, asi que se conecta a la red externa
# "edge" para que ese Caddy lo alcance como reverse proxy, con un
# container_name unico para evitar colisiones de resolucion DNS con el
# servicio "web" de otros proyectos en esa misma red compartida (ver
# deploy/shared-caddy.md). "backend" tampoco publica puerto: todo el trafico
# externo entra por Caddy -> frontend -> backend.
#
# Requiere un archivo .env en el mismo directorio (ver .env.example) y que
# exista la red externa: docker network create edge
#
# Solo hace falta clonar ESTE repo en la VM: las imagenes ya incluyen el
# frontend compilado, no hace falta el repo de tialola-frontend ahi.

services:
  db:
    # 18 porque respaldar-base-datos.ps1 genera los dumps con la version de
    # PostgreSQL instalada en cada equipo, y pg_restore no puede leer un
    # dump mas nuevo que el propio servidor (ver deploy/migrar-datos.md)
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contabilidadRestaurante}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/yonatanlop/restaurantelola-backend:${IMAGE_TAG:-latest}
    container_name: restaurantelola-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-contabilidadRestaurante}?connectTimeout=10&socketTimeout=30&tcpKeepAlive=true
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en .env}
      PROPINAS_ENABLED: ${PROPINAS_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  frontend:
    image: ghcr.io/yonatanlop/restaurantelola-frontend:${IMAGE_TAG:-latest}
    container_name: restaurantelola-web
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - default
      - edge

networks:
  edge:
    external: true

volumes:
  pgdata:
